<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Galactic Density Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 900px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #000;
            border-radius: 8px;
            cursor: crosshair;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: #334155;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            font-family: monospace;
            color: #38bdf8;
            font-weight: bold;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>4D Multi-Galaxy Density Profile</h2>
        <div class="legend">
            <div class="legend-item"><div class="box" style="background: #38bdf8;"></div> MW NFW Halo (Static)</div>
            <div class="legend-item"><div class="box" style="background: #f43f5e;"></div> Aggregate Baryonic Density (4D)</div>
        </div>

        <canvas id="graphCanvas" width="860" height="500"></canvas>

        <div class="controls">
            <div class="control-group">
                <label>Number of Galaxies (N): <span id="nVal" class="value-display">15</span></label>
                <input type="range" id="sliderN" min="1" max="50" value="15">
            </div>
            <div class="control-group">
                <label>Radius Variation (R%): <span id="rVal" class="value-display">20%</span></label>
                <input type="range" id="sliderR" min="0" max="100" value="20">
            </div>
            <div class="control-group">
                <label>Center Offset (C%): <span id="cVal" class="value-display">5%</span></label>
                <input type="range" id="sliderC" min="0" max="100" value="5">
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const sliderN = document.getElementById('sliderN');
    const sliderR = document.getElementById('sliderR');
    const sliderC = document.getElementById('sliderC');
    
    const nDisplay = document.getElementById('nVal');
    const rDisplay = document.getElementById('rVal');
    const cDisplay = document.getElementById('cVal');

    // Constants for Milky Way
    const MW_RS = 20;      // NFW scale radius (kpc)
    const MW_RD = 3.5;     // Disk scale length (kpc)
    const MW_ZD = 0.35;    // Disk scale height (kpc)
    const MAX_DIST = 150;  // Max radius to plot (kpc)
    const SAMPLES = 200;   // Number of points on X axis

    // State
    let galaxies = [];

    class Galaxy {
        constructor(rVar, cVar) {
            // Random variation in size
            const scale = 1 + (Math.random() * 2 - 1) * (rVar / 100);
            this.rd = MW_RD * scale;
            this.zd = MW_ZD * scale;

            // 4D Center Position (C variation relative to 100kpc scale)
            const offsetRange = (cVar / 100) * 100;
            this.x = (Math.random() * 2 - 1) * offsetRange;
            this.y = (Math.random() * 2 - 1) * offsetRange;
            this.z = (Math.random() * 2 - 1) * offsetRange;
            this.w = (Math.random() * 2 - 1) * offsetRange;

            // Random Orientation (Normal vector of the disk)
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            this.normal = {
                x: Math.sin(phi) * Math.cos(theta),
                y: Math.sin(phi) * Math.sin(theta),
                z: Math.cos(phi)
            };
        }

        // Get baryonic density at a 4D point (x,y,z,w)
        getDensityAt(px, py, pz, pw) {
            // Relative vector from galaxy center to point
            const dx = px - this.x;
            const dy = py - this.y;
            const dz = pz - this.z;
            const dw = pw - this.w; // Euclidean distance includes 4th dim

            // Project 3D component onto the disk plane
            // distance along normal
            const dot = dx * this.normal.x + dy * this.normal.y + dz * this.normal.z;
            const h = Math.abs(dot); // Height above disk
            
            // Radial distance in disk plane (within the 3D subspace)
            const rProj = Math.sqrt(dx*dx + dy*dy + dz*dz - dot*dot);
            
            // Factor in the W-axis separation as an additional "thickness" decay 
            // to represent 4D Euclidean distance influence
            const wDist = Math.abs(dw);

            // Exponential disk profile
            return Math.exp(-rProj / this.rd) * Math.exp(-h / this.zd) * Math.exp(-wDist / this.zd);
        }
    }

    function initGalaxies() {
        const N = parseInt(sliderN.value);
        const R = parseInt(sliderR.value);
        const C = parseInt(sliderC.value);
        
        galaxies = [];
        for (let i = 0; i < N; i++) {
            galaxies.push(new Galaxy(R, C));
        }
    }

    function nfwProfile(r) {
        if (r < 0.1) r = 0.1;
        const x = r / MW_RS;
        return 1 / (x * Math.pow(1 + x, 2));
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const padding = 60;
        const w = canvas.width - padding * 2;
        const h = canvas.height - padding * 2;

        // Draw Axes
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, h + padding);
        ctx.lineTo(w + padding, h + padding);
        ctx.stroke();

        // Labels
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Radius from Origin (kpc)', canvas.width / 2, canvas.height - 20);
        ctx.save();
        ctx.translate(20, canvas.height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('Relative Density (log scale)', 0, 0);
        ctx.restore();

        // Mapping functions
        const getX = (r) => padding + (r / MAX_DIST) * w;
        const getY = (rho) => {
            // Using log scale for density
            const minLog = -5;
            const maxLog = 1;
            const logRho = Math.log10(rho + 0.00001);
            const normalized = (logRho - minLog) / (maxLog - minLog);
            return h + padding - Math.max(0, Math.min(1, normalized)) * h;
        };

        // 1. Draw NFW Profile (Static MW Halo)
        ctx.beginPath();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        for (let i = 0; i <= SAMPLES; i++) {
            const r = (i / SAMPLES) * MAX_DIST;
            const rho = nfwProfile(r);
            const px = getX(r);
            const py = getY(rho);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // 2. Draw Aggregate Baryonic Profile
        // We sample several directions in 4D space and average them to get the profile
        ctx.beginPath();
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 3;

        for (let i = 0; i <= SAMPLES; i++) {
            const r = (i / SAMPLES) * MAX_DIST;
            
            // To get a representative 1D profile of a 4D distribution, 
            // we sample density at distance R along a specific 4D vector
            // (In a real 4D shell integration this would be complex, here we visualize a slice)
            let totalRho = 0;
            
            // We sum contribution from all N galaxies at this 4D radius
            // We use a fixed 4D vector (1,1,1,1 normalized) for the profile path
            const pos = r / Math.sqrt(4); 
            galaxies.forEach(g => {
                totalRho += g.getDensityAt(pos, pos, pos, pos);
            });

            const px = getX(r);
            const py = getY(totalRho);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
    }

    function update() {
        nDisplay.textContent = sliderN.value;
        rDisplay.textContent = sliderR.value + '%';
        cDisplay.textContent = sliderC.value + '%';
        initGalaxies();
        draw();
    }

    [sliderN, sliderR, sliderC].forEach(s => s.addEventListener('input', update));

    // Initial run
    initGalaxies();
    draw();
</script>
</body>
</html>
